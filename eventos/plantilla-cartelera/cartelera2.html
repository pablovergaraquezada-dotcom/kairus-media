<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:LG;src:url(fonts/LeagueGothic%255Bwdth%255D.ttf)}
@font-face{font-family:DMI;src:url(fonts/DMSerifDisplay-Italic.ttf)}
@font-face{font-family:AR;src:url(fonts/Archivo%255Bwdth,wght%255D.ttf)}
:root{--noche:#0e0b10;--lila:#ce78f0;--crema:#f2eadc}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;background:var(--noche);color:var(--crema);font-family:AR}
#c{position:relative;width:1920px;height:1080px;overflow:hidden;background:url(fx/bg.png)}
.lay{position:absolute;inset:0}
.title{position:absolute;left:26px;top:112px;font-family:LG;font-size:430px;line-height:.8;letter-spacing:2px;white-space:nowrap;
 background:linear-gradient(180deg,#fbf3e6 0%,#efdcd6 45%,rgba(190,140,200,.55) 100%);-webkit-background-clip:text;color:transparent;
 filter:blur(.6px) drop-shadow(0 0 40px rgba(206,120,240,.35))}
.kick{position:absolute;left:52px;top:52px;font-family:DMI;font-size:62px;color:var(--lila);text-shadow:0 0 24px rgba(206,120,240,.6);z-index:30}
#people{position:absolute;left:0;top:0;width:1420px;height:1080px;
 -webkit-mask-image:linear-gradient(90deg,#000 0,#000 1320px,transparent 1440px)}
#people img{position:absolute}
.back{filter:drop-shadow(0 0 22px rgba(206,120,240,.25))}
.front{filter:drop-shadow(-10px 14px 26px rgba(8,4,12,.85)) drop-shadow(0 0 18px rgba(206,120,240,.22))}
.botfog{position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(0deg,rgba(12,7,16,.98) 0%,rgba(12,7,16,.85) 30%,transparent 100%);z-index:20}
.rightfog{position:absolute;top:0;right:0;width:700px;height:100%;background:linear-gradient(90deg,transparent,rgba(10,6,14,.72) 40%,rgba(10,6,14,.86));z-index:21}
.col{position:absolute;left:1430px;top:56px;width:460px;z-index:30}
.logo{height:56px;display:block;margin:0 0 30px auto}
.hd{font-family:AR;font-weight:700;font-size:15px;letter-spacing:7px;color:var(--lila);margin-bottom:10px;text-align:right}
.row{display:grid;grid-template-columns:104px 1fr;align-items:end;padding:9px 0}
.d{font-family:LG;font-size:52px;line-height:.8;color:var(--lila);text-shadow:0 0 18px rgba(206,120,240,.35)}
.d small{display:block;font-family:AR;font-weight:700;font-size:12px;letter-spacing:4px;color:var(--crema);opacity:.6;margin-bottom:6px}
.i .n{font-family:LG;font-size:42px;line-height:.86;text-transform:uppercase;letter-spacing:.5px}
.i .a{font-family:DMI;font-size:20px;color:#dcc6e6;margin-top:3px}
.i .a b{font-family:AR;font-weight:700;font-size:13px;letter-spacing:3px;color:var(--crema);opacity:.7;margin-left:8px}
.foot{position:absolute;left:52px;right:52px;bottom:34px;z-index:30;display:flex;align-items:baseline;gap:30px;border-top:1px solid rgba(242,234,220,.22);padding-top:16px}
.foot .k{font-family:DMI;font-size:26px;color:var(--lila)}
.foot .l{font-family:LG;font-size:40px;letter-spacing:1px;margin-left:10px}
.foot .h{font-family:AR;font-weight:700;font-size:15px;letter-spacing:3px;opacity:.75;margin-left:8px}
.foot .r{margin-left:auto;font-family:AR;font-weight:700;font-size:15px;letter-spacing:5px;opacity:.75}
.grain{position:absolute;inset:0;z-index:40;opacity:.13;mix-blend-mode:overlay;pointer-events:none}
.leak{position:absolute;inset:0;z-index:35;mix-blend-mode:screen;opacity:.8;pointer-events:none}
</style></head><body><div id="c">
<div class="title">STAND UP</div>
<img class="lay" src="fx/haze1.png" style="z-index:2;opacity:.6">
<div id="people"></div>
<div class="botfog"></div>
<div class="rightfog"></div>
<div class="kick">en vivo en Kairus</div>
<div class="col"><img class="logo" src="logo.png"><div class="hd">PRÓXIMOS SHOWS · 2º PISO</div><div id="list"></div></div>
<div class="foot"><span><span class="k">todos los jueves</span><span class="l">BINGO + KARAOKE</span><span class="h">21:00</span></span>
<span><span class="k">todos los domingos</span><span class="l">EN FAMILIA</span><span class="h">13:00</span></span><span class="r">LOS ROBLES 3668 · @KAIRUS_CL</span></div>
<img class="leak" src="fx/leak.png">
<canvas class="grain" id="g" width="1920" height="1080"></canvas>
</div>
<script>
const DATA=__DATA__;
const pp=document.getElementById('people');
DATA.people.forEach(p=>{if(p.haze){const h=document.createElement('img');h.src='fx/haze2.png';h.className='lay';h.style.zIndex=p.z;h.style.opacity=.75;pp.appendChild(h);return;}const im=document.createElement('img');
 im.src='fx/'+p.f+(p.back?'_b':'')+'.png';im.className=p.back?'back':'front';
 im.style.left=p.x+'px';im.style.height=p.h+'px';im.style.bottom=(p.b||0)+'px';im.style.zIndex=p.z;
 if(p.flip)im.style.transform='scaleX(-1)';pp.appendChild(im);
 if(p.haze){const h=document.createElement('img');h.src='fx/haze2.png';h.className='lay';h.style.zIndex=p.z;h.style.opacity=.7;pp.appendChild(h);}});
const L=document.getElementById('list');
DATA.events.forEach(e=>L.insertAdjacentHTML('beforeend',`<div class="row"><div class="d"><small>${e.sem}</small>${e.dia}</div><div class="i"><div class="n">${e.show}</div><div class="a">${e.art}<b>${e.h}</b></div></div></div>`));
const g=document.getElementById('g').getContext('2d'),id=g.createImageData(1920,1080);
for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}
g.putImageData(id,0,0);
</script></body></html>
